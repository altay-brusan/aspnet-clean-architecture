version: '3.9'

services:
  evently.api:
    image: ${DOCKER_REGISTRY-}eventlyapi
    container_name: Evently.Api
    build:
      context: .
      dockerfile: src/API/Evently.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    depends_on:
      evently.database:
        condition: service_healthy
      evently.seq:
        condition: service_started

  evently.database:
    image: postgres:latest
    container_name: Evently.Database
    environment:
      - POSTGRES_DB=evently
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evently"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - evently-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  evently.seq:
    image: datalust/seq:latest
    container_name: Evently.Seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=SuperSecret1!
    ports:
      - 5341:5341
      - 8081:80

volumes:
  evently-db-data:
